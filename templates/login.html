<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="container py-4">
<h1>Вход</h1>
<form method="post" class="d-flex flex-column gap-3" style="max-width: 320px;">
    <input name="username" placeholder="Имя пользователя" required class="form-control">
    <input name="password" type="password" placeholder="Пароль" required class="form-control">
    <button type="submit" class="btn btn-primary">Войти</button>
</form>
<a href="/register" class="mt-3 d-inline-block">Нет аккаунта?</a>
</body>
</html>
