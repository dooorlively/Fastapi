<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="container py-4">
<h1>Регистрация</h1>
<form method="post" class="d-flex flex-column gap-3" style="max-width: 320px;">
    <input name="username" placeholder="Имя пользователя" required class="form-control">
    <input name="password" type="password" placeholder="Пароль" required class="form-control">
    <input name="password_confirm" type="password" placeholder="Подтверждение пароля" required class="form-control">
    <button type="submit" class="btn btn-success">Зарегистрироваться</button>
</form>
<a href="/login" class="mt-3 d-inline-block">Уже есть аккаунт?</a>
</body>
</html>
